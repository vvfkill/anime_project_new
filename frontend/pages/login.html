<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Вход — Anime</title>

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/pages/auth.css"
    >
</head>

<body>

    <div class="auth-page">

        <aside class="auth-sidebar">

            <a
                href="index.html"
                class="auth-logo"
            >
                ANIME
            </a>

            <nav class="auth-sidebar-nav">

                <span class="active">
                    01
                </span>

                <span>
                    02
                </span>

            </nav>

        </aside>


        <main class="auth-main">

            <header class="auth-header">

                <nav class="auth-navigation">

                    <a href="index.html">
                        ГЛАВНАЯ
                    </a>

                    <a href="catalog.html">
                        КАТАЛОГ
                    </a>

                    <a href="list.html">
                        СПИСОК
                    </a>

                    <a href="bookmarks.html">
                        ЗАКЛАДКИ
                    </a>

                    <a href="reviews.html">
                        ОТЗЫВЫ
                    </a>

                </nav>

            </header>


            <section class="auth-content">

                <div class="auth-image">

                    <img
                        src="../images/hero.jpg"
                        alt="Anime"
                    >

                </div>


                <div class="auth-card">

                    <h1>
                        Вход в аккаунт
                    </h1>

                    <p class="auth-description">
                        Добро пожаловать обратно.
                        Продолжите отслеживать любимое аниме.
                    </p>


                    <form
                        id="loginForm"
                        class="auth-form"
                    >

                        <div class="auth-field">

                            <label>
                                EMAIL
                            </label>

                            <div class="auth-input-wrapper">

                                <span class="input-icon">
                                    @
                                </span>

                                <input
                                    type="email"
                                    name="email"
                                    placeholder="Введите email"
                                    required
                                >

                            </div>

                        </div>


                        <div class="auth-field">

                            <label>
                                ПАРОЛЬ
                            </label>

                            <div class="auth-input-wrapper">

                                <span class="input-icon">
                                    •
                                </span>

                                <input
                                    type="password"
                                    name="password"
                                    placeholder="Введите пароль"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                >
                                    👁
                                </button>

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="auth-submit-button"
                        >
                            ВОЙТИ
                        </button>


                        <p class="auth-switch">

                            Нет аккаунта?

                            <a
                                href="register.html"
                            >
                                ЗАРЕГИСТРИРОВАТЬСЯ
                            </a>

                        </p>

                    </form>

                </div>

            </section>

        </main>

    </div>


    <script
        src="../js/auth.js"
    ></script>

</body>

</html>
