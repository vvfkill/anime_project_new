<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Закладки — AnimeHub</title>

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

    <div class="app-wrapper">

        <!-- Левая панель -->

        <aside class="sidebar">

            <a
                href="index.html"
                class="logo"
            >
                ANIMEHUB
            </a>


            <nav class="sidebar-nav">

                <a
                    href="index.html"
                    class="sidebar-link"
                >
                    01
                </a>

                <a
                    href="catalog.html"
                    class="sidebar-link"
                >
                    02
                </a>

                <a
                    href="list.html"
                    class="sidebar-link"
                >
                    03
                </a>

                <a
                    href="bookmarks.html"
                    class="sidebar-link active"
                >
                    04
                </a>

                <a
                    href="reviews.html"
                    class="sidebar-link"
                >
                    05
                </a>

            </nav>

        </aside>


        <!-- Основной контент -->

        <main class="main-content">

            <!-- Верхнее меню -->

            <header class="header">

                <a
                    href="index.html"
                    class="mobile-logo"
                >
                    ANIMEHUB
                </a>


                <nav class="top-navigation">

                    <a href="index.html">
                        ГЛАВНАЯ
                    </a>

                    <a href="catalog.html">
                        КАТАЛОГ
                    </a>

                    <a href="list.html">
                        СПИСОК
                    </a>

                    <a
                        href="bookmarks.html"
                        class="active"
                    >
                        ЗАКЛАДКИ
                    </a>

                    <a href="reviews.html">
                        ОТЗЫВЫ
                    </a>

                </nav>


                <button
                    class="header-search-button"
                    type="button"
                >
                    ⌕
                </button>

            </header>


            <!-- Верхняя часть -->

            <section class="bookmarks-intro">

                <div>

                    <h1>
                        МОИ ЗАКЛАДКИ
                    </h1>

                    <p>
                        Аниме, которые ты сохранил.<br>
                        Продолжай смотреть любимое в любой момент.
                    </p>

                </div>


                <div class="bookmarks-search">

                    <span>
                        ⌕
                    </span>

                    <input
                        type="text"
                        id="bookmarkSearch"
                        placeholder="Поиск в закладках..."
                    >

                </div>

            </section>


            <!-- Фильтры -->

            <section class="bookmarks-controls">

                <div
                    class="bookmark-filters"
                >

                    <button
                        class="bookmark-filter active"
                        data-status="all"
                    >
                        ВСЕ
                    </button>

                    <button
                        class="bookmark-filter"
                        data-status="watching"
                    >
                        СМОТРЮ
                    </button>

                    <button
                        class="bookmark-filter"
                        data-status="planned"
                    >
                        ЗАПЛАНИРОВАНО
                    </button>

                    <button
                        class="bookmark-filter"
                        data-status="completed"
                    >
                        ПРОСМОТРЕНО
                    </button>

                    <button
                        class="bookmark-filter"
                        data-status="postponed"
                    >
                        ОТЛОЖЕНО
                    </button>

                </div>


                <select
                    class="bookmark-sort"
                    id="bookmarkSort"
                >

                    <option value="recent">
                        СОРТИРОВКА: НЕДАВНИЕ
                    </option>

                    <option value="rating">
                        ПО РЕЙТИНГУ
                    </option>

                    <option value="year">
                        ПО ГОДУ
                    </option>

                    <option value="title">
                        ПО НАЗВАНИЮ
                    </option>

                </select>

            </section>


            <!-- Карточки -->

            <section
                class="bookmarks-grid"
                id="bookmarksGrid"
            >

                <p class="empty-text">
                    Загрузка закладок...
                </p>

            </section>

        </main>

    </div>


    <script
        src="../js/bookmarks.js"
    ></script>

</body>

</html>
