<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Регистрация — AnimeHub</title>

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/pages/auth.css"
    >
</head>

<body>

    <div class="auth-page">

        <aside class="auth-sidebar">

            <a
                href="index.html"
                class="auth-logo"
            >
                ANIMEHUB
            </a>

            <nav class="auth-sidebar-nav">

                <span>
                    01
                </span>

                <span class="active">
                    02
                </span>

            </nav>

        </aside>


        <main class="auth-main">

            <header class="auth-header">

                <nav class="auth-navigation">

                    <a href="index.html">
                        ГЛАВНАЯ
                    </a>

                    <a href="catalog.html">
                        КАТАЛОГ
                    </a>

                    <a href="list.html">
                        СПИСОК
                    </a>

                    <a href="bookmarks.html">
                        ЗАКЛАДКИ
                    </a>

                    <a href="reviews.html">
                        ОТЗЫВЫ
                    </a>

                </nav>

            </header>


            <section class="auth-content">

                <div class="auth-image">

                    <img
                        src="../images/hero.jpg"
                        alt="Anime"
                    >

                </div>


                <div class="auth-card">

                    <h1>
                        Создание аккаунта
                    </h1>

                    <p class="auth-description">
                        Создайте профиль, чтобы сохранять аниме,
                        отзывы и закладки.
                    </p>


                    <form
                        id="registerForm"
                        class="auth-form"
                    >

                        <div class="auth-field">

                            <label>
                                НИКНЕЙМ
                            </label>

                            <div class="auth-input-wrapper">

                                <input
                                    type="text"
                                    name="nickname"
                                    placeholder="Введите никнейм"
                                    required
                                >

                            </div>

                        </div>


                        <div class="auth-field">

                            <label>
                                EMAIL
                            </label>

                            <div class="auth-input-wrapper">

                                <input
                                    type="email"
                                    name="email"
                                    placeholder="Введите email"
                                    required
                                >

                            </div>

                        </div>


                        <div class="auth-field">

                            <label>
                                ТЕЛЕФОН
                            </label>

                            <div class="auth-input-wrapper">

                                <input
                                    type="tel"
                                    name="phone"
                                    placeholder="Введите номер телефона"
                                    required
                                >

                            </div>

                        </div>


                        <div class="auth-field">

                            <label>
                                ПАРОЛЬ
                            </label>

                            <div class="auth-input-wrapper">

                                <input
                                    type="password"
                                    name="password"
                                    placeholder="Введите пароль"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                >
                                    👁
                                </button>

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="auth-submit-button"
                        >
                            ЗАРЕГИСТРИРОВАТЬСЯ
                        </button>


                        <p class="auth-switch">

                            Уже есть аккаунт?

                            <a
                                href="login.html"
                            >
                                ВОЙТИ
                            </a>

                        </p>

                    </form>

                </div>

            </section>

        </main>

    </div>


    <script
        src="../js/auth.js"
    ></script>

</body>

</html>
