<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Аниме</title>

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/pages/anime.css"
    >
</head>

<body>

<div class="app-wrapper">

    <aside class="sidebar">

        <nav class="sidebar-nav">

            <a
                href="index.html"
                class="sidebar-link"
            >
                01
            </a>

            <a
                href="catalog.html"
                class="sidebar-link"
            >
                02
            </a>

            <a
                href="list.html"
                class="sidebar-link"
            >
                03
            </a>

            <a
                href="bookmarks.html"
                class="sidebar-link"
            >
                04
            </a>

            <a
                href="reviews.html"
                class="sidebar-link"
            >
                05
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="header">

            <nav class="top-navigation">

                <a href="index.html">
                    ГЛАВНАЯ
                </a>

                <a href="catalog.html">
                    КАТАЛОГ
                </a>

                <a href="list.html">
                    СПИСОК
                </a>

                <a href="bookmarks.html">
                    ЗАКЛАДКИ
                </a>

                <a href="reviews.html">
                    ОТЗЫВЫ
                </a>

            </nav>

        </header>


        <section class="anime-page">

            <div id="animeDetails">
                <p>Загрузка аниме...</p>
            </div>


            <section class="anime-lower">

                <nav class="anime-tabs">

                    <button
                        class="anime-tab active"
                        data-tab="description"
                    >
                        Описание
                    </button>

                    <button
                        class="anime-tab"
                        data-tab="characters"
                    >
                        Персонажи
                    </button>

                    <button
                        class="anime-tab"
                        data-tab="reviews"
                    >
                        Отзывы
                        <span id="reviewsCount">0</span>
                    </button>

                    <button
                        class="anime-tab"
                        data-tab="similar"
                    >
                        Похожие аниме
                    </button>

                </nav>


                <section
                    id="descriptionTab"
                    class="tab-content active"
                >

                    <div
                        id="descriptionContainer"
                        class="anime-description-content"
                    >
                        <p>Загрузка описания...</p>
                    </div>

                </section>


                <section
                    id="charactersTab"
                    class="tab-content"
                    hidden
                >

                    <div
                        id="charactersContainer"
                        class="characters-container"
                    >
                        <p>Загрузка персонажей...</p>
                    </div>

                </section>


                <section
                    id="reviewsTab"
                    class="tab-content"
                    hidden
                >

                    <div class="reviews-header">

                        <h2>
                            Отзывы
                        </h2>

                        <button
                            type="button"
                            class="primary-btn"
                            id="writeReviewBtn"
                        >
                            Написать отзыв
                        </button>

                    </div>

                    <div
                        id="reviewsContainer"
                        class="reviews-container"
                    >
                        <p>Загрузка отзывов...</p>
                    </div>

                </section>


                <section
                    id="similarTab"
                    class="tab-content"
                    hidden
                >

                    <div
                        id="similarAnimeContainer"
                        class="similar-anime-container"
                    >
                        <p>Загрузка похожих аниме...</p>
                    </div>

                </section>

            </section>

        </section>

    </main>

</div>


<script
    src="../js/anime.js"
></script>

</body>

</html>
