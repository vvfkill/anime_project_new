<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Каталог — AnimeHub</title>

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/pages/catalog.css"
    >

</head>

<body>

    <div class="app-wrapper">

        <!-- Боковая панель -->

        <aside class="sidebar">

            <a
                href="index.html"
                class="logo"
            >
                ANIMEHUB
            </a>

            <nav class="sidebar-nav">

                <a href="index.html" class="sidebar-link">
                    01
                </a>

                <a href="catalog.html" class="sidebar-link active">
                    02
                </a>

                <a href="list.html" class="sidebar-link">
                    03
                </a>

                <a href="bookmarks.html" class="sidebar-link">
                    04
                </a>

                <a href="reviews.html" class="sidebar-link">
                    05
                </a>

            </nav>

            <div class="sidebar-bottom">
                <span>© 2026</span>
            </div>

        </aside>


        <!-- Основной контент -->

        <main class="main-content">

            <!-- Header -->

            <header class="header">

                <button
                    class="menu-button"
                    type="button"
                >
                    ☰
                </button>


                <nav class="top-navigation">

                    <a href="index.html">
                        ГЛАВНАЯ
                    </a>

                    <a
                        href="catalog.html"
                        class="nav-active"
                    >
                        КАТАЛОГ
                    </a>

                    <a href="list.html">
                        СПИСОК
                    </a>

                    <a href="bookmarks.html">
                        ЗАКЛАДКИ
                    </a>

                    <a href="reviews.html">
                        ОТЗЫВЫ
                    </a>

                </nav>


                <div class="header-actions">

                    <a
                        href="login.html"
                        class="login-link"
                    >
                        ВОЙТИ
                    </a>

                </div>

            </header>


            <!-- Каталог -->

            <section class="catalog-page">

                <div class="catalog-top">

                    <div>

                        <h1>
                            КАТАЛОГ
                        </h1>

                        <p>
                            Исследуй нашу коллекцию аниме.
                        </p>

                        <p>
                            Фильтруй, находи и смотри лучшее.
                        </p>

                    </div>


                    <!-- Поиск -->

                    <div class="catalog-search">

                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Поиск аниме..."
                        >

                    </div>

                </div>


                <!-- Фильтры -->

                <div class="catalog-filters">

                    <select id="genreFilter">

                        <option value="">
                            ЖАНРЫ
                        </option>

                    </select>


                    <select id="yearFilter">

                        <option value="">
                            ГОД
                        </option>

                    </select>


                    <select id="typeFilter">

                        <option value="">
                            СТАТУС
                        </option>

                    </select>


                    <select id="sortFilter">

                        <option value="rating">
                            СОРТИРОВКА: ПО ПОПУЛЯРНОСТИ
                        </option>

                        <option value="year">
                            СНАЧАЛА НОВЫЕ
                        </option>

                        <option value="title">
                            ПО НАЗВАНИЮ
                        </option>

                    </select>

                </div>


                <!-- Карточки -->

                <div
                    class="catalog-grid"
                    id="catalogAnime"
                >

                    <p class="empty-text">
                        Загрузка...
                    </p>

                </div>


                <!-- Пагинация -->

                <div
                    class="pagination"
                    id="pagination"
                >

                    <button
                        type="button"
                        id="prevPage"
                    >
                        ←
                    </button>


                    <div
                        class="pagination-pages"
                        id="paginationPages"
                    >
                    </div>


                    <button
                        type="button"
                        id="nextPage"
                    >
                        →
                    </button>

                </div>

            </section>

        </main>

    </div>


    <script
        src="../js/catalog.js"
    ></script>

</body>

</html>
