<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Отзывы — AnimeHub
    </title>


    <link
        rel="stylesheet"
        href="../css/base.css"
    >


    <link
        rel="stylesheet"
        href="../css/layout.css"
    >


    <link
        rel="stylesheet"
        href="../css/components.css"
    >


    <link
        rel="stylesheet"
        href="../css/pages/reviews.css"
    >

</head>


<body>

    <div class="app-wrapper">


        <!-- БОКОВАЯ ПАНЕЛЬ -->

        <aside class="sidebar">

            <a
                href="index.html"
                class="logo"
            >
                ANIMEHUB
            </a>


            <nav class="sidebar-nav">

                <a href="index.html" class="sidebar-link">
                    01
                </a>

                <a href="catalog.html" class="sidebar-link">
                    02
                </a>

                <a href="list.html" class="sidebar-link">
                    03
                </a>

                <a href="bookmarks.html" class="sidebar-link">
                    04
                </a>

                <a href="reviews.html" class="sidebar-link active">
                    05
                </a>

            </nav>


            <div class="sidebar-bottom">

                <span>
                    © 2026
                </span>

            </div>

        </aside>


        <!-- ОСНОВНАЯ ЧАСТЬ -->

        <main class="main-content">


            <!-- HEADER -->

            <header class="header">

                <button
                    class="menu-button"
                    type="button"
                >
                    ☰
                </button>


                <nav class="top-navigation">

                    <a href="index.html">
                        ГЛАВНАЯ
                    </a>


                    <a href="catalog.html">
                        КАТАЛОГ
                    </a>


                    <a href="list.html">
                        СПИСОК
                    </a>


                    <a href="bookmarks.html">
                        ЗАКЛАДКИ
                    </a>


                    <a
                        href="reviews.html"
                        class="nav-active"
                    >
                        ОТЗЫВЫ
                    </a>

                </nav>


                <div class="header-actions">

                    <a
                        href="login.html"
                        class="login-link"
                    >
                        ВОЙТИ
                    </a>

                </div>

            </header>


            <!-- СТРАНИЦА ОТЗЫВОВ -->

            <section class="reviews-page">


                <!-- ВЕРХНЯЯ ЧАСТЬ -->

                <div class="reviews-top">


                    <div class="reviews-heading">

                        <h1>
                            ОТЗЫВЫ
                        </h1>


                        <p>
                            Читайте отзывы других зрителей
                            <br>
                            и делитесь своим мнением об аниме.
                        </p>

                    </div>


                    <!-- ПОИСК -->

                    <div class="reviews-search">

                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Поиск отзывов..."
                        >

                    </div>

                </div>


                <!-- ФИЛЬТРЫ -->

                <div class="reviews-filters">

                    <div class="status-tabs">

                        <button
                            type="button"
                            class="review-filter active"
                            data-filter="all"
                        >
                            ВСЕ
                        </button>

                        <button
                            type="button"
                            class="review-filter"
                            data-filter="positive"
                        >
                            ПОЛОЖИТЕЛЬНЫЕ
                        </button>

                        <button
                            type="button"
                            class="review-filter"
                            data-filter="negative"
                        >
                            ОТРИЦАТЕЛЬНЫЕ
                        </button>

                        <button
                            type="button"
                            class="review-filter"
                            data-filter="my"
                        >
                            С МОИМИ ОЦЕНКАМИ
                        </button>

                    </div>


                    <select id="sortFilter">

                        <option value="new">
                            СОРТИРОВКА: СВЕЖИЕ СНАЧАЛА
                        </option>

                        <option value="old">
                            СТАРЫЕ СНАЧАЛА
                        </option>

                        <option value="rating">
                            ПО ОЦЕНКЕ
                        </option>

                    </select>

                </div>


                <!-- СПИСОК ОТЗЫВОВ -->

                <div
                    class="reviews-list"
                    id="reviewsContainer"
                >

                    <p class="empty-text">
                        Загрузка...
                    </p>

                </div>


                <!-- ПАГИНАЦИЯ -->

                <div
                    class="pagination"
                    id="pagination"
                >

                    <button
                        type="button"
                        id="prevPage"
                    >
                        ←
                    </button>


                    <div
                        class="pagination-pages"
                        id="paginationPages"
                    >
                    </div>


                    <button
                        type="button"
                        id="nextPage"
                    >
                        →
                    </button>

                </div>


            </section>

        </main>

    </div>


    <!-- JAVASCRIPT -->

    <script
        src="../js/reviews.js"
    ></script>


</body>

</html>
